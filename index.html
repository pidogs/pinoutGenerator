<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinout Maker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <div class="page-header-copy">
          <h1>Pinout Maker</h1>
          <p>Upload an image, label the pins, and export your diagram.</p>
        </div>
        <div class="export-control">
          <button id="export" type="button" disabled>Export PNG</button>
          <details class="export-menu">
            <summary aria-label="Choose export format" title="Choose export format">
              <span aria-hidden="true"></span>
            </summary>
            <div class="export-options" role="group" aria-label="Export format">
              <button
                class="export-option selected"
                type="button"
                data-format="png"
                aria-pressed="true"
              >
                PNG
              </button>
              <button
                class="export-option"
                type="button"
                data-format="jpeg"
                aria-pressed="false"
              >
                JPEG
              </button>
              <button
                class="export-option"
                type="button"
                data-format="webp"
                aria-pressed="false"
              >
                WebP
              </button>
            </div>
          </details>
        </div>
      </header>

      <div class="layout">
        <aside class="panel">
          <label for="image-upload">Image or SVG</label>
          <input id="image-upload" type="file" accept="image/*,.svg" />

          <label for="pin-count">Number of pins</label>
          <div class="number-control">
            <input id="pin-count" type="number" min="1" max="200" value="8" />
            <div class="number-stepper">
              <button
                id="increase-pin-count"
                class="number-step"
                type="button"
                aria-label="Increase number of pins"
                title="Increase number of pins"
              >
                <span class="arrow-up" aria-hidden="true"></span>
              </button>
              <button
                id="decrease-pin-count"
                class="number-step"
                type="button"
                aria-label="Decrease number of pins"
                title="Decrease number of pins"
              >
                <span class="arrow-down" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <label for="list-position">Pin list position</label>
          <select id="list-position">
            <option value="bottom">Bottom</option>
            <option value="left" selected>Left</option>
          </select>

          <label for="title">Title</label>
          <input
            id="title"
            type="text"
            placeholder="e.g. Board pinout"
            maxlength="100"
          />

          <label for="side-label">Side label</label>
          <input
            id="side-label"
            type="text"
            placeholder="e.g. Front side"
            maxlength="100"
          />

          <div class="range-heading">
            <label for="text-scale">Diagram text scale</label>
            <output id="text-scale-value" for="text-scale">1.0x</output>
          </div>
          <input
            id="text-scale"
            type="range"
            min="-1"
            max="1"
            step="0.01"
            value="0"
            aria-valuetext="1.0x"
          />
          <div class="range-ticks" aria-hidden="true">
            <span>0.1x</span>
            <span>1x</span>
            <span>10x</span>
          </div>

          <div class="range-heading">
            <label for="pin-number-scale">Pin number scale</label>
            <output id="pin-number-scale-value" for="pin-number-scale">1.0x</output>
          </div>
          <input
            id="pin-number-scale"
            type="range"
            min="-1"
            max="1"
            step="0.01"
            value="0"
            aria-valuetext="1.0x"
          />
          <div class="range-ticks" aria-hidden="true">
            <span>0.1x</span>
            <span>1x</span>
            <span>10x</span>
          </div>

          <div class="pin-heading">
            <strong>Pin descriptions</strong>
            <span id="pin-status"></span>
          </div>

          <p class="hint">
            Click a pin number below, then click the image to place it. Drag a
            number on the image to move it.
          </p>

          <div id="pin-list" class="pin-list"></div>

          <div class="actions">
            <button id="remove-pin" type="button" class="secondary">
              Remove selected number
            </button>
            <button id="clear-pins" type="button" class="secondary">
              Clear placed numbers
            </button>
          </div>

          <p id="message" class="message" role="status"></p>
        </aside>

        <section class="workspace" aria-label="Pinout preview">
          <p id="placeholder">Upload an image to get started.</p>
          <canvas id="canvas" hidden></canvas>
        </section>
      </div>
    </main>
  </body>
</html>
